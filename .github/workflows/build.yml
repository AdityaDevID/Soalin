name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK release
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Ganti nama APK
        run: mv app/build/outputs/apk/release/app-release.apk Soalin-v1.0.${{ github.run_number }}.apk

      # APK dikirim ke halaman Releases (bukan Actions artifact)
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Soalin v1.0.${{ github.run_number }}
          files: Soalin-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true
          make_latest: true
